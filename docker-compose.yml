services:
  media-dock:
    build: .
    container_name: media-dock
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8080"
      STORAGE_SQLITE_PATH: /config/mediadock.db
      AUTH_TOKEN_FILE: /config/auth-token
      # Optional local-path mode. Leave unset for API-only acquisition.
      # DOWNLOAD_INCOMING_DIR: /downloads/incoming
    volumes:
      - ${MEDIA_CONFIG_HOST_PATH:-./data/config}:/config
      # Add this only when DOWNLOAD_INCOMING_DIR is explicitly configured.
      # - ${MEDIA_DOWNLOADS_HOST_PATH:-./data/downloads}:/downloads
